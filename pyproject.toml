[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-stock-analyzer"
version = "0.1.0"
description = "An intelligent stock analysis system built with Microsoft Agent Framework and Azure AI Foundry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jerry Joseph", email = "jerryjoseph.net@gmail.com"},
]
keywords = ["ai", "agents", "stock-analysis", "azure", "microsoft-agent-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core dependencies
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    # Microsoft Agent Framework (pre-release versions)
    "agent-framework>=1.0.0a1",
    # Azure dependencies
    "azure-identity>=1.15.0",
    # Stock market data
    "yfinance>=0.2.18",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    # Code quality
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    # Development
    "ipython>=8.12.0",
]

agent-framework = [
    # Microsoft Agent Framework (pre-release)
    "agent-framework>=1.0.0b251028",
]

[project.urls]
Homepage = "https://github.com/jerryjoseph-net/agentic-ai-stock-analyzer"
Repository = "https://github.com/jerryjoseph-net/agentic-ai-stock-analyzer"
Issues = "https://github.com/jerryjoseph-net/agentic-ai-stock-analyzer/issues"

[project.scripts]
stock-analyzer = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
